# One-off: give the QVAC container temporary Internet access to download model weights.
# QVAC's registry is peer-to-peer (Hyperswarm: needs outbound UDP) plus HTTPS (Hugging Face).
# scripts/bootstrap-models.sh generates the equivalent override for whatever stack you run
# (QVAC, classic, piper) and then recreates the containers WITHOUT Internet access.
services:
  qvac:
    networks: [core, ai, egress]

networks:
  egress: {}
