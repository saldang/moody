# Moody - home profile (single host). See docs/03-setup-ambiente.md and docs/06-running.md
#
# AI runtime: QVAC by Tether (LLM, embeddings, speech-to-text, text-to-speech) - docs/13-qvac.md
# Alternatives: compose.classic.yaml (Ollama + faster-whisper + Piper), compose.piper.yaml (Piper TTS).
#
# Network segmentation (privacy & security by design):
#   lan    : the only network with a published port (gateway 8443, ntfy 8088)
#   core   : gateway <-> brain, qvac (speech)          (internal: no Internet)
#   ai     : brain <-> qvac (LLM, embeddings)          (internal: no Internet)
#   tools  : brain <-> wellbeing <-> ntfy              (internal: no Internet)
# Models are downloaded once with compose.bootstrap.yaml, then the runtime is offline.

name: moody

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: local
    options: { max-size: "10m", max-file: "3" }

x-moody: &moody
  <<: *hardening
  image: moody/server:${MOODY_VERSION:-0.1.0}
  build: { context: ../server }
  user: "${MOODY_UID:-1000}:${MOODY_GID:-1000}"
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  pids_limit: 128

x-moody-env: &moody-env
  TZ: ${TZ:-Europe/Rome}
  MOODY_LOG_LEVEL: ${MOODY_LOG_LEVEL:-INFO}
  MOODY_LOCALE: ${MOODY_LOCALE:-it}
  MOODY_TLS_CERT: /pki/self/tls.pem
  MOODY_TLS_KEY: /pki/self/tls.key
  MOODY_TLS_CA: /pki/service-ca.pem

services:
  gateway:
    <<: *moody
    command: ["moody-gateway"]
    hostname: gateway
    ports: ["${MOODY_GATEWAY_BIND:-0.0.0.0}:8443:8443"]
    environment:
      <<: *moody-env
      MOODY_DEVICE_CA: /pki/device-ca.pem
      MOODY_DEVICES_FILE: /config/devices.yaml
      MOODY_BRAIN_URL: https://brain:8080
      MOODY_STT_BACKEND: ${MOODY_STT_BACKEND:-openai}
      MOODY_TTS_BACKEND: ${MOODY_TTS_BACKEND:-openai}
      MOODY_SPEECH_URL: ${MOODY_SPEECH_URL:-http://qvac:11435/v1}
      MOODY_SPEECH_API_KEY_FILE: /run/secrets/qvac_api_key
      MOODY_STT_MODEL: moody-stt
      MOODY_TTS_MODEL: moody-tts
      MOODY_TTS_VOICE: ${MOODY_TTS_VOICE:-F1}
      MOODY_FIRMWARE_DIR: /firmware
    secrets: [qvac_api_key]
    volumes:
      - ./pki/services/gateway:/pki/self:ro
      - ./pki/service-ca/ca.pem:/pki/service-ca.pem:ro
      - ./pki/device-ca/ca.pem:/pki/device-ca.pem:ro
      - ./config/devices.yaml:/config/devices.yaml:ro
      - ./firmware:/firmware:ro          # signed OTA image + version.txt (optional)
    networks: [lan, core]
    depends_on:
      brain: { condition: service_started }
      qvac: { condition: service_healthy }
    mem_limit: 256m

  brain:
    <<: *moody
    command: ["moody-brain"]
    hostname: brain
    environment:
      <<: *moody-env
      MOODY_LLM_BACKEND: ${MOODY_LLM_BACKEND:-openai}
      MOODY_LLM_URL: ${MOODY_LLM_URL:-http://qvac:11435/v1}
      MOODY_LLM_MODEL: ${MOODY_LLM_MODEL:-moody-llm}
      MOODY_LLM_API_KEY_FILE: /run/secrets/qvac_api_key
      MOODY_LLM_TEMPERATURE: ${MOODY_LLM_TEMPERATURE:-0.2}
      MOODY_EMBED_MODEL: ${MOODY_EMBED_MODEL:-moody-embed}
      MOODY_EMBED_BACKEND: ${MOODY_EMBED_BACKEND:-}
      MOODY_EMBED_URL: ${MOODY_EMBED_URL:-}
      MOODY_RAG_MIN_SCORE: ${MOODY_RAG_MIN_SCORE:-0.55}
      MOODY_GUARD_MODEL: ${MOODY_GUARD_MODEL:-}
      MOODY_GUARD_URL: ${MOODY_GUARD_URL:-}
      MOODY_TOOL_POLICY: /config/tool-policy.yaml
      MOODY_KNOWLEDGE_DIR: /knowledge
      MOODY_DATA_DIR: /data
      MOODY_WELLBEING_URL: https://wellbeing:8090/mcp
      MOODY_ESCALATION: ${MOODY_ESCALATION:-ask}
      MOODY_LOG_TRANSCRIPTS: ${MOODY_LOG_TRANSCRIPTS:-false}
      MOODY_HA_MCP_URL: ${MOODY_HA_MCP_URL:-}
      MOODY_HA_TOKEN_FILE: /run/secrets/ha_token
    secrets: [ha_token, qvac_api_key]
    volumes:
      - ./pki/services/brain:/pki/self:ro
      - ./pki/service-ca/ca.pem:/pki/service-ca.pem:ro
      - ./config/tool-policy.yaml:/config/tool-policy.yaml:ro
      - ./knowledge:/knowledge:ro
      - ./data/brain:/data
    networks: [core, ai, tools]
    depends_on:
      qvac: { condition: service_healthy }
      wellbeing: { condition: service_started }
    mem_limit: 512m

  wellbeing:
    <<: *moody
    command: ["moody-wellbeing"]
    hostname: wellbeing
    environment:
      <<: *moody-env
      MOODY_DATA_DIR: /data
      MOODY_DATA_KEY_FILE: /run/secrets/data_key
      MOODY_RETENTION_DAYS: ${MOODY_RETENTION_DAYS:-30}
      MOODY_NTFY_URL: http://ntfy
      MOODY_NTFY_TOPIC: ${MOODY_NTFY_TOPIC:-}
      MOODY_NTFY_TOKEN_FILE: /run/secrets/ntfy_token
    secrets: [data_key, ntfy_token]
    volumes:
      - ./pki/services/wellbeing:/pki/self:ro
      - ./pki/service-ca/ca.pem:/pki/service-ca.pem:ro
      - ./data/wellbeing:/data
    networks: [tools]
    mem_limit: 256m

  qvac:
    <<: *hardening
    image: moody/qvac:${QVAC_CLI_VERSION:-0.20.0}
    build:
      context: ./qvac
      args: { QVAC_CLI_VERSION: "${QVAC_CLI_VERSION:-0.20.0}" }
    hostname: qvac
    user: "${MOODY_UID:-1000}:${MOODY_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      # KV cache built from conversations: RAM only, never on disk, gone at restart (privacy).
      - /qvac-home:size=2g,mode=1777
    volumes:
      - ./config/qvac/${QVAC_CONFIG:-qvac.config.json}:/config/qvac.config.json:ro
      - ./data/qvac-models:/models
    secrets: [qvac_api_key]
    networks: [core, ai]
    mem_limit: ${QVAC_MEM_LIMIT:-12g}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11435/v1/models',{headers:{authorization:'Bearer '+require('fs').readFileSync('/run/secrets/qvac_api_key','utf8').trim()}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  ntfy:
    <<: *hardening
    image: binwiederhier/ntfy:${NTFY_VERSION:-v2.38.2}
    hostname: ntfy
    command: ["serve"]
    environment:
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./config/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy:/var/lib/ntfy
    ports: ["${MOODY_NTFY_BIND:-127.0.0.1}:8088:80"]
    networks: [tools, lan]

networks:
  lan: {}
  core: { internal: true }
  ai: { internal: true }
  tools: { internal: true }

volumes:
  ntfy: {}

secrets:
  data_key: { file: ./secrets/data_key }
  ntfy_token: { file: ./secrets/ntfy_token }
  ha_token: { file: ./secrets/ha_token }
  qvac_api_key: { file: ./secrets/qvac_api_key }
