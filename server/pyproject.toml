[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moody"
version = "0.1.0"
description = "Privacy-first, open-source wellbeing voice assistant: edge gateway, local LLM brain, wellbeing MCP tools"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Moody contributors" }]
# Every runtime dependency below is MIT / BSD / Apache-2.0 licensed (MIT-compatible).
# See ../docs/10-licenze.md before adding a new one.
dependencies = [
  "websockets>=15,<18",       # BSD-3-Clause
  "fastapi>=0.165.0,<1",        # MIT
  "uvicorn>=0.32,<1",         # BSD-3-Clause
  "httpx>=0.27,<1",           # BSD-3-Clause
  "wyoming>=1.6,<2",          # MIT
  "mcp>=2.3,<3",              # MIT
  "pydantic>=2.9,<3",         # MIT
  "pyyaml>=6,<7",             # MIT
  "cryptography>=44",         # Apache-2.0 OR BSD-3-Clause
  "pyjwt[crypto]>=2.9,<3",    # MIT
  "numpy>=2,<3",              # BSD-3-Clause
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pip-audit>=2.7"]
pki = ["pyserial>=3.5"]  # BSD-3-Clause, only for firmware provisioning

[project.scripts]
moody-gateway = "moody.gateway.__main__:main"
moody-brain = "moody.brain.__main__:main"
moody-wellbeing = "moody.wellbeing_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["moody*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
